name: Build release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.2.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run unit tests
        run: ./gradlew build --no-daemon
      - name: Generate checksums
        working-directory: build/libs
        run: |
          for artifact in *.jar; do sha256sum "$artifact" > "$artifact.sha256"; done
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" build/libs/*.jar build/libs/*.sha256 --clobber
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/
